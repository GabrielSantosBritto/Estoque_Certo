$kind: http-request
url: "{{baseUrl}}/api/fornecedores-produtos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fornecedorId": {{fornecedorInativoId}},
      "produtoId": {{produtoId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Resposta tem mensagem de erro", function () {
          pm.expect(pm.response.json()).to.have.property("erro");
      });
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/api/fornecedores/{{fornecedorId}}/produtos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Fornecedor tem o produto associado", function () {
          const id = Number(pm.collectionVariables.get("produtoId"));
          pm.expect(pm.response.json().map(a => a.produtoId)).to.include(id);
      });
    language: text/javascript
order: 8000

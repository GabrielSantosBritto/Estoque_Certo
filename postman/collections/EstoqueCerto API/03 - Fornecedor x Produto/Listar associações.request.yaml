$kind: http-request
url: "{{baseUrl}}/api/fornecedores-produtos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Lista contém a associação", function () {
          const id = Number(pm.collectionVariables.get("associacaoId"));
          pm.expect(pm.response.json().map(a => a.id)).to.include(id);
      });
    language: text/javascript
order: 7000

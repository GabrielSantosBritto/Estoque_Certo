$kind: http-request
url: "{{baseUrl}}/api/fornecedores-produtos/{{associacaoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Associação liga o fornecedor e o produto certos", function () {
          const a = pm.response.json();
          pm.expect(a.fornecedorId).to.eql(Number(pm.collectionVariables.get("fornecedorId")));
          pm.expect(a.produtoId).to.eql(Number(pm.collectionVariables.get("produtoId")));
          pm.expect(a.produtoCodigo).to.eql(pm.collectionVariables.get("produtoCodigo"));
      });
    language: text/javascript
order: 6000

$kind: http-request
url: "{{baseUrl}}/api/fornecedores/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Resposta tem mensagem de erro", function () {
          pm.expect(pm.response.json()).to.have.property("erro");
      });
    language: text/javascript
order: 9000

$kind: http-request
url: "{{baseUrl}}/api/fornecedores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cnpj": "{{cnpj}}",
      "razaoSocial": "Outro Fornecedor LTDA",
      "nomeFantasia": "Fornecedor Teste",
      "inscricaoEstadual": "123456789",
      "telefone": "(11) 99999-0000",
      "email": "contato@fornecedorteste.com.br",
      "cep": "01001-000",
      "logradouro": "Praça da Sé",
      "numero": "100",
      "complemento": "Sala 1",
      "bairro": "Sé",
      "municipio": "São Paulo",
      "uf": "SP",
      "observacoes": "Criado pela coleção de testes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", function () {
          pm.response.to.have.status(409);
      });

      pm.test("Resposta tem mensagem de erro", function () {
          pm.expect(pm.response.json()).to.have.property("erro");
      });
    language: text/javascript
order: 2000

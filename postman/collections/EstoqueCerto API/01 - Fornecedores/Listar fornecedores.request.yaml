$kind: http-request
url: "{{baseUrl}}/api/fornecedores"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Lista contém o fornecedor cadastrado", function () {
          const id = Number(pm.collectionVariables.get("fornecedorId"));
          pm.expect(pm.response.json().map(f => f.id)).to.include(id);
      });
    language: text/javascript
order: 5000

$kind: http-request
url: "{{baseUrl}}/api/fornecedores/cnpj/{{cnpj}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Encontrou o fornecedor certo", function () {
          pm.expect(pm.response.json().id)
              .to.eql(Number(pm.collectionVariables.get("fornecedorId")));
      });
    language: text/javascript
order: 7000

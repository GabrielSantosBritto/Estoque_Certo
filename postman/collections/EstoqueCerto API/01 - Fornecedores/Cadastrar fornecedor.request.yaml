$kind: http-request
url: "{{baseUrl}}/api/fornecedores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cnpj": "{{cnpj}}",
      "razaoSocial": "Fornecedor Teste LTDA",
      "nomeFantasia": "Fornecedor Teste",
      "inscricaoEstadual": "123456789",
      "telefone": "(11) 99999-0000",
      "email": "contato@fornecedorteste.com.br",
      "cep": "01001-000",
      "logradouro": "Praça da Sé",
      "numero": "100",
      "complemento": "Sala 1",
      "bairro": "Sé",
      "municipio": "São Paulo",
      "uf": "SP",
      "observacoes": "Criado pela coleção de testes"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Gera um CNPJ aleatório (14 dígitos) para a coleção poder rodar várias vezes
      function cnpjAleatorio() {
          let s = "";
          for (let i = 0; i < 14; i++) s += Math.floor(Math.random() * 10);
          return s;
      }
      pm.collectionVariables.set("cnpj", cnpjAleatorio());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Retorna o ID criado", function () {
          const id = pm.response.json().id;
          pm.expect(id).to.be.a("number");
          pm.collectionVariables.set("fornecedorId", id);
      });
    language: text/javascript
order: 1000

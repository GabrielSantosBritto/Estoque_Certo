$kind: http-request
url: "{{baseUrl}}/api/produtos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Arroz 5kg",
      "descricao": "Criado pela coleção de testes",
      "unidadeMedida": "UN",
      "precoVenda": 29.9,
      "quantidadeMinima": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", function () {
          pm.response.to.have.status(201);
      });

      pm.collectionVariables.set("produtoId", pm.response.json().id);
    language: text/javascript
order: 1000

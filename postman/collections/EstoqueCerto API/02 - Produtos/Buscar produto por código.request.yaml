$kind: http-request
url: "{{baseUrl}}/api/produtos/codigo/{{produtoCodigo}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Encontrou o produto certo", function () {
          pm.expect(pm.response.json().id)
              .to.eql(Number(pm.collectionVariables.get("produtoId")));
      });
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/api/produtos/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Não existe",
      "descricao": "Criado pela coleção de testes",
      "unidadeMedida": "UN",
      "precoVenda": 29.9,
      "quantidadeMinima": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Resposta tem mensagem de erro", function () {
          pm.expect(pm.response.json()).to.have.property("erro");
      });
    language: text/javascript
order: 12000

$kind: http-request
url: "{{baseUrl}}/api/produtos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Lista contém o produto cadastrado", function () {
          const id = Number(pm.collectionVariables.get("produtoId"));
          pm.expect(pm.response.json().map(p => p.id)).to.include(id);
      });
    language: text/javascript
order: 4000
